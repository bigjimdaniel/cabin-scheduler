{% extends "base.html" %}

{% block title %}Password Reset | Daniel Dream{% endblock %}

{% block content %}
<section class="panel auth-panel">
    <h1>Reset password</h1>
    <p>Enter the email address associated with your invited account.</p>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset instructions</button>
    </form>
</section>
{% endblock %}
