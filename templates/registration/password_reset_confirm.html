{% extends "base.html" %}

{% block title %}Choose New Password | Daniel Dream{% endblock %}

{% block content %}
<section class="panel auth-panel">

        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update password</button>
    </form>
</section>
{% endblock %}
